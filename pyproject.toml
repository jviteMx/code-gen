[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-agent"
version = "0.2.0"
description = "Local Claude-Code-like coding assistant — Claude or LMStudio backend"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39",
    "openai>=1.50",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
# Optional: more accurate token counting (falls back to a heuristic without it).
accurate-tokens = ["tiktoken>=0.5"]
# Benchmark harness (benchmark/): grades the agent against the template app.
# Node >= 20 and `playwright install chromium` are additional prerequisites.
bench = [
    "pytest>=8",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7,<3",
    "playwright>=1.45,<2",
    "pytest-playwright>=0.5,<1",
    "schemathesis>=3.36",
]

[project.scripts]
code-agent = "code_agent.cli:main"
ca = "code_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.pytest.ini_options]
# Benchmark F2P tests are fixtures that only work after the harness injects
# them into an isolated template app. Normal repository tests live here.
testpaths = ["tests"]
