[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-agent"
version = "0.1.0"
description = "Local Claude-Code-like coding assistant — Claude or LMStudio backend"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39",
    "openai>=1.50",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
# Optional: more accurate token counting (falls back to a heuristic without it).
accurate-tokens = ["tiktoken>=0.5"]

[project.scripts]
code-agent = "code_agent.cli:main"
ca = "code_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]
